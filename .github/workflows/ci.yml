name: CI

on:
  push:
    branches: [ main, master, "refactor/**" ]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore music.slnx -p:Platform=x64

      - name: Build (x64)
        run: dotnet build music.slnx -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/music.Tests.csproj -c Release
